# ==============================================================================
# DailyActivityTracker - Production Docker Compose Architecture
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ==============================================================================

name: dailyactivitytracker-prod

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # Internal-only: Port 5432 is NOT exposed to the host for security.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dailyactivity-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-DailyActivityTracker}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-DailyActivityTracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # ASP.NET Core Backend API Service (.NET 8)
  # Runs as non-root user 'app' on unprivileged port 8080.
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dailyactivity-backend-prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-DailyActivityTracker};Username=${POSTGRES_USER:-app_user};Password=${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD is required};SSL Mode=Prefer;"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY:?Error: JWT_SECRET_KEY is required and must be at least 32 bytes}"
      JwtSettings__Issuer: ${JWT_ISSUER:-https://api.yourdomain.com}
      JwtSettings__Audience: ${JWT_AUDIENCE:-https://app.yourdomain.com}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-https://app.yourdomain.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # React 19 / Vite Frontend Service (Nginx unprivileged)
  # Serves compiled static SPA bundle as unprivileged non-root user.
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:?Error: VITE_API_BASE_URL is required for production build}"
    container_name: dailyactivity-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ------------------------------------------------------------------------------
# Isolated Internal Network
# ------------------------------------------------------------------------------
networks:
  app-network:
    name: dailyactivitytracker-prod_app-network
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_prod_data:
    name: dailyactivity_postgres_prod_data
